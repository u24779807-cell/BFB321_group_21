{% extends "base.html" %}


{% block title %}
Edit {{ product.name }}
{% endblock %}


{% block content %}

<section class="form-page">

    <div class="form-container">

        <div class="form-header">

            <p class="eyebrow">
                INVENTORY MANAGEMENT
            </p>

            <h1>
                Edit {{ product.name }}
            </h1>

            <p>
                Update the product information below.
            </p>

        </div>


        <form
            method="POST"
            class="product-form"
        >

            <div class="form-section">

                <h2>
                    Product Information
                </h2>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            value="{{ product.name }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Inventory Class
                        </label>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option
                                value="A"
                                {% if product.category == "A" %}
                                selected
                                {% endif %}
                            >
                                Class A
                            </option>

                            <option
                                value="B"
                                {% if product.category == "B" %}
                                selected
                                {% endif %}
                            >
                                Class B
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="quantity">
                            Current Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="0"
                            value="{{ product.quantity }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="expiry_date">
                            Expiry Date
                        </label>

                        <input
                            type="date"
                            id="expiry_date"
                            name="expiry_date"
                            value="{{ product.expiry_date }}"
                            required
                        >

                    </div>

                </div>

            </div>


            <div class="form-section">

                <h2>
                    Supply Chain Information
                </h2>


                <div class="form-grid">

                    <div class="form-group">

                        <label for="annual_demand">
                            Annual Demand
                        </label>

                        <input
                            type="number"
                            id="annual_demand"
                            name="annual_demand"
                            min="0.01"
                            step="0.01"
                            value="{{ product.annual_demand }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="ordering_cost">
                            Ordering Cost
                        </label>

                        <input
                            type="number"
                            id="ordering_cost"
                            name="ordering_cost"
                            min="0.01"
                            step="0.01"
                            value="{{ product.ordering_cost }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="holding_cost">
                            Holding Cost
                        </label>

                        <input
                            type="number"
                            id="holding_cost"
                            name="holding_cost"
                            min="0.01"
                            step="0.01"
                            value="{{ product.holding_cost }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="avg_daily_demand">
                            Average Daily Demand
                        </label>

                        <input
                            type="number"
                            id="avg_daily_demand"
                            name="avg_daily_demand"
                            min="0"
                            step="0.01"
                            value="{{ product.avg_daily_demand }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="lead_time">
                            Lead Time
                        </label>

                        <input
                            type="number"
                            id="lead_time"
                            name="lead_time"
                            min="0"
                            step="0.01"
                            value="{{ product.lead_time }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="demand_std_dev">
                            Demand Standard Deviation
                        </label>

                        <input
                            type="number"
                            id="demand_std_dev"
                            name="demand_std_dev"
                            min="0"
                            step="0.01"
                            value="{{ product.demand_std_dev }}"
                            required
                        >

                    </div>

                </div>

            </div>


            <div class="form-actions">

                <a
                    href="{{ url_for(
                        'product_detail',
                        product_id=product.id
                    ) }}"
                    class="secondary-action"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="primary-button"
                >

                    <i class="fas fa-save"></i>

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
