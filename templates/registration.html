<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Spaza Shop - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <h1>Smart Spaza Shop</h1>
        <p>Food Network & Inventory Management</p>

        <h2>Create an Account</h2>

        <form action="/register" method="POST">

            <label for="first_name">First Name</label>
            <input type="text"
                   id="first_name"
                   name="first_name"
                   required>

            <label for="surname">Surname</label>
            <input type="text"
                   id="surname"
                   name="surname"
                   required>

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <label for="phone_number">Phone Number</label>
            <input type="tel"
                   id="phone_number"
                   name="phone_number"
                   required>

            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   required
                   minlength="8">

            <label for="confirm_password">Confirm Password</label>
            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   required
                   minlength="8">

            <button type="submit">Register</button>
        </form>

        <p>Already have an account?
            <a href="/">Log in here</a>
        </p>
    </div>
</body>
</html>
