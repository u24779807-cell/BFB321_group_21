<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inventory | Smart Spaza</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<style>
		:root {
			--inventory-ink: #172a2a;
			--inventory-muted: #667572;
			--inventory-green: #176b52;
			--inventory-border: #dce5df;
			--inventory-paper: #fffefa;
		}

		body.inventory-page {
			min-height: 100vh;
			color: var(--inventory-ink);
			background: #edf2ed;
			font-family: 'DM Sans', sans-serif;
		}

		.inventory-page nav {
			padding: 14px clamp(18px, 5vw, 72px);
			background: var(--inventory-paper);
			border-bottom: 1px solid var(--inventory-border);
		}

		.inventory-page nav img {
			display: block;
			width: 116px;
			height: auto;
		}

		.inventory-page nav ul {
			margin: 0;
		}

		.inventory-page nav ul li a {
			color: var(--inventory-ink);
			font-size: 13px;
			font-weight: 700;
		}

		.inventory-page nav ul li::after {
			background: var(--inventory-green);
		}

		.inventory-main {
			width: min(1180px, calc(100% - 40px));
			margin: 54px auto 80px;
		}

		.inventory-heading {
			display: flex;
			align-items: end;
			justify-content: space-between;
			gap: 24px;
			margin-bottom: 28px;
		}

		.inventory-eyebrow {
			margin: 0 0 8px;
			color: var(--inventory-green);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 1.2px;
			text-transform: uppercase;
		}

		.inventory-heading h1 {
			margin: 0;
			font-family: 'Manrope', sans-serif;
			font-size: clamp(30px, 5vw, 44px);
			font-weight: 800;
		}

		.inventory-heading p {
			margin: 9px 0 0;
			color: var(--inventory-muted);
			font-size: 15px;
		}

		.inventory-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			padding: 18px 20px;
			background: var(--inventory-paper);
			border: 1px solid var(--inventory-border);
			border-bottom: 0;
			border-radius: 8px 8px 0 0;
		}

		.inventory-search {
			position: relative;
			width: min(360px, 100%);
		}

		.inventory-search svg {
			position: absolute;
			top: 50%;
			left: 13px;
			width: 17px;
			height: 17px;
			color: #71817c;
			transform: translateY(-50%);
			pointer-events: none;
		}

		.inventory-search input {
			min-height: 42px;
			padding-left: 40px;
			border-color: var(--inventory-border);
			font-size: 14px;
		}

		.inventory-search input:focus,
		.inventory-input:focus {
			border-color: #5c9b80;
			box-shadow: 0 0 0 3px rgb(23 107 82 / 12%);
		}

		.add-item-button {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			min-height: 42px;
			padding: 0 15px;
			color: #fff;
			background: var(--inventory-green);
			border: 0;
			border-radius: 5px;
			font-size: 14px;
			font-weight: 700;
			white-space: nowrap;
		}

		.add-item-button:hover {
			background: #10573f;
		}

		.add-item-button svg {
			width: 17px;
			height: 17px;
		}

		.inventory-table-wrap {
			overflow-x: auto;
			background: var(--inventory-paper);
			border: 1px solid var(--inventory-border);
			border-radius: 0 0 8px 8px;
		}

		.inventory-table {
			min-width: 760px;
			margin: 0;
			--bs-table-bg: transparent;
			--bs-table-striped-bg: #f8faf7;
		}

		.inventory-table thead th {
			padding: 14px 18px;
			color: #53645f;
			background: #f2f6f1;
			border-bottom: 1px solid var(--inventory-border);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: .8px;
			text-transform: uppercase;
			white-space: nowrap;
		}

		.inventory-table tbody td {
			height: 72px;
			padding: 12px 18px;
			border-color: #e8ede8;
			vertical-align: middle;
		}

		.inventory-table tbody tr:last-child td {
			border-bottom: 0;
		}

		.inventory-input {
			min-height: 40px;
			border-color: var(--inventory-border);
			font-size: 14px;
		}

		.quantity-control {
			display: inline-flex;
			align-items: center;
			gap: 10px;
		}

		.quantity-button {
			display: grid;
			width: 34px;
			height: 34px;
			place-items: center;
			color: var(--inventory-green);
			background: #f0f6f1;
			border: 1px solid #d8e5da;
			border-radius: 5px;
			font-size: 20px;
			line-height: 1;
		}

		.quantity-button:hover:not(:disabled) {
			color: #fff;
			background: var(--inventory-green);
		}

		.quantity-button:disabled {
			color: #aab4af;
			background: #f4f5f3;
			cursor: not-allowed;
		}

		.adjustment-value {
			min-width: 18px;
			text-align: center;
			font-size: 14px;
			font-weight: 700;
			font-variant-numeric: tabular-nums;
		}

		.total-value {
			font-family: 'Manrope', sans-serif;
			font-size: 18px;
			font-weight: 800;
			font-variant-numeric: tabular-nums;
		}

		.empty-row td {
			height: 120px !important;
			color: var(--inventory-muted);
			text-align: center;
		}

		.inventory-count {
			margin: 12px 2px 0;
			color: var(--inventory-muted);
			font-size: 13px;
		}

		@media (max-width: 700px) {
			.inventory-page nav ul {
				padding: 50px 0 0;
			}

			.inventory-page nav ul li a {
				font-size: 14px;
			}

			.inventory-main {
				width: min(100% - 28px, 1180px);
				margin-top: 34px;
			}

			.inventory-heading {
				align-items: start;
				flex-direction: column;
				gap: 0;
			}

			.inventory-toolbar {
				align-items: stretch;
				flex-direction: column;
				padding: 14px;
			}

			.inventory-search {
				width: 100%;
			}

			.add-item-button {
				justify-content: center;
			}
		}
	</style>
</head>
<body class="inventory-page">
	<nav>
		<a href="index.html" aria-label="Smart Spaza home"><img src="images/logo.png" alt="Smart Spaza"></a>
		<div class="nav-links" id="navLinks">
			<i class="fa fa-times" onclick="hideMenu()" aria-label="Close navigation"></i>
			<ul>
				<li><a href="index.html">HOME</a></li>
				<li><a href="USER GUIDE.html">USER GUIDE</a></li>
				<li><a href="CLASS A INVENTORY.html">CLASS A INVENTORY</a></li>
				<li><a href="CLASS B INVENTORY.html">CLASS B INVENTORY</a></li>
				<li><a href="SUPPORT.html">SUPPORT</a></li>
			</ul>
		</div>
		<i class="fa fa-bars" onclick="showMenu()" aria-label="Open navigation"></i>
	</nav>

	<main class="inventory-main">
		<header class="inventory-heading">
			<div>
				<p class="inventory-eyebrow">Smart Spaza / Stock control</p>
				<h1>Inventory</h1>
				<p>Keep item counts current as stock moves.</p>
			</div>
		</header>

		<section aria-label="Inventory table">
			<div class="inventory-toolbar">
				<label class="inventory-search">
					<span class="visually-hidden">Search inventory</span>
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
					<input id="inventorySearch" class="form-control" type="search" placeholder="Search inventory..." autocomplete="off">
				</label>
				<button id="addItemButton" class="add-item-button" type="button">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
					Add item
				</button>
			</div>

			<div class="inventory-table-wrap">
				<table class="table table-striped inventory-table">
					<thead>
						<tr>
							<th scope="col">Adjust stock</th>
							<th scope="col">Manual quantity</th>
							<th scope="col">Inventory name</th>
							<th scope="col">Total</th>
							<th scope="col" aria-label="Empty column"></th>
						</tr>
					</thead>
					<tbody id="inventoryRows"></tbody>
				</table>
			</div>
			<p id="inventoryCount" class="inventory-count" aria-live="polite"></p>
		</section>
	</main>

	<script>
		const storageKey = 'smart-spaza-inventory';
		const rowsElement = document.getElementById('inventoryRows');
		const searchElement = document.getElementById('inventorySearch');
		const countElement = document.getElementById('inventoryCount');
		let inventory = loadInventory();

		function loadInventory() {
			try {
				const savedInventory = JSON.parse(localStorage.getItem(storageKey) || '[]');
				return Array.isArray(savedInventory) ? savedInventory : [];
			} catch {
				return [];
			}
		}

		function saveInventory() {
			localStorage.setItem(storageKey, JSON.stringify(inventory));
		}

		function renderInventory() {
			const searchTerm = searchElement.value.trim().toLocaleLowerCase();
			const visibleInventory = inventory
				.map((item, index) => ({ item, index }))
				.filter(({ item }) => item.name.toLocaleLowerCase().includes(searchTerm));

			rowsElement.replaceChildren();

			if (visibleInventory.length === 0) {
				const emptyRow = document.createElement('tr');
				emptyRow.className = 'empty-row';
				const emptyCell = document.createElement('td');
				emptyCell.colSpan = 5;
				emptyCell.textContent = inventory.length === 0 ? 'No inventory items yet. Add an item to get started.' : 'No items match your search.';
				emptyRow.append(emptyCell);
				rowsElement.append(emptyRow);
			}

			visibleInventory.forEach(({ item, index }) => {
				const row = document.createElement('tr');
				const adjustmentCell = document.createElement('td');
				const control = document.createElement('div');
				control.className = 'quantity-control';

				const subtractButton = document.createElement('button');
				subtractButton.className = 'quantity-button';
				subtractButton.type = 'button';
				subtractButton.textContent = '-';
				subtractButton.setAttribute('aria-label', `Subtract one from ${item.name || 'unnamed item'}`);
				subtractButton.disabled = item.adjustment <= 0;
				subtractButton.addEventListener('click', () => changeAdjustment(index, -1));

				const adjustmentValue = document.createElement('span');
				adjustmentValue.className = 'adjustment-value';
				adjustmentValue.textContent = item.adjustment;
				adjustmentValue.setAttribute('aria-label', 'Stock adjustments');

				const addButton = document.createElement('button');
				addButton.className = 'quantity-button';
				addButton.type = 'button';
				addButton.textContent = '+';
				addButton.setAttribute('aria-label', `Add one to ${item.name || 'unnamed item'}`);
				addButton.addEventListener('click', () => changeAdjustment(index, 1));

				control.append(subtractButton, adjustmentValue, addButton);
				adjustmentCell.append(control);

				const quantityCell = document.createElement('td');
				const quantityInput = document.createElement('input');
				quantityInput.className = 'form-control inventory-input';
				quantityInput.type = 'number';
				quantityInput.min = '1';
				quantityInput.step = '1';
				quantityInput.inputMode = 'numeric';
				quantityInput.value = item.quantity;
				quantityInput.setAttribute('aria-label', `Manual quantity for ${item.name || 'unnamed item'}`);
				quantityInput.addEventListener('change', () => {
					const quantity = Number(quantityInput.value);
					if (Number.isInteger(quantity) && quantity > 0) {
						inventory[index].quantity = quantity;
						saveInventory();
						renderInventory();
					} else {
						quantityInput.value = inventory[index].quantity;
					}
				});
				quantityCell.append(quantityInput);

				const nameCell = document.createElement('td');
				const nameInput = document.createElement('input');
				nameInput.className = 'form-control inventory-input';
				nameInput.type = 'text';
				nameInput.maxLength = 80;
				nameInput.placeholder = 'Enter item name';
				nameInput.value = item.name;
				nameInput.setAttribute('aria-label', 'Inventory name');
				nameInput.addEventListener('input', () => {
					inventory[index].name = nameInput.value;
					saveInventory();
					updateTotal(row, inventory[index]);
					updateCount();
				});
				nameInput.addEventListener('input', renderInventoryIfSearchChanges);
				nameCell.append(nameInput);

				const totalCell = document.createElement('td');
				const totalValue = document.createElement('span');
				totalValue.className = 'total-value';
				totalCell.append(totalValue);
				updateTotal(row, item, totalValue);

				row.append(adjustmentCell, quantityCell, nameCell, totalCell, document.createElement('td'));
				rowsElement.append(row);
			});

			updateCount();
		}

		function updateTotal(row, item, target) {
			const totalElement = target || row.querySelector('.total-value');
			if (totalElement) totalElement.textContent = item.quantity + item.adjustment;
		}

		function updateCount() {
			const itemLabel = inventory.length === 1 ? 'item' : 'items';
			countElement.textContent = `${inventory.length} ${itemLabel}`;
		}

		function changeAdjustment(index, amount) {
			inventory[index].adjustment = Math.max(0, inventory[index].adjustment + amount);
			saveInventory();
			renderInventory();
		}

		function renderInventoryIfSearchChanges() {
			if (searchElement.value.trim()) renderInventory();
		}

		document.getElementById('addItemButton').addEventListener('click', () => {
			inventory.push({ name: '', quantity: 1, adjustment: 0 });
			saveInventory();
			renderInventory();
			const nameInputs = rowsElement.querySelectorAll('input[type="text"]');
			nameInputs[nameInputs.length - 1]?.focus();
		});

		searchElement.addEventListener('input', renderInventory);
		renderInventory();

		const navLinks = document.getElementById('navLinks');
		function showMenu() { navLinks.style.right = '0'; }
		function hideMenu() { navLinks.style.right = '-200px'; }
	</script>
</body>
</html>
